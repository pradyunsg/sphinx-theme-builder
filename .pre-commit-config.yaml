repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: [prettier]
        types: [text]
        pass_filenames: true

      - id: diagnostic-check-docs
        name: diagnostic.check-docs
        entry: python -m diagnostic.check-docs src docs/errors.md
        language: python
        additional_dependencies: [diagnostic]
        pass_filenames: false
        files: "(^src/|^docs/errors.md$)"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
